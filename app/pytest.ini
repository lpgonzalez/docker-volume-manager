; pytest configuration for the DVM project.
;
; Test layout (auto-marked via app/tests/conftest.py):
;   tests/unit/        → @pytest.mark.unit        — pure Python, no subprocess / no Docker
;   tests/functional/  → @pytest.mark.functional  — needs tar / gpg / par2 / bash (DVM test image)
;   tests/integration/ → @pytest.mark.integration — needs /var/run/docker.sock
;
; The Makefile selects tiers via `-m`:
;   make test             → pytest -m "not integration"  (unit + functional)
;   make test-unit        → pytest -m unit
;   make test-functional  → pytest -m functional
;   make test-integration → pytest -m integration  (requires docker.sock mount)

[pytest]

minversion = 8.0

testpaths = tests

python_files = test_*.py

addopts = -ra --showlocals --durations=10 --strict-markers

markers =
    unit: pure Python unit tests (no subprocess, no Docker dependencies)
    functional: tests needing system tools (tar, gpg, par2, bash) — run inside the DVM test image
    integration: tests needing a reachable Docker daemon at /var/run/docker.sock
    slow: tests that take more than a few seconds

log_cli = true
log_cli_level = INFO

filterwarnings = error
